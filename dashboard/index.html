<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Session Replayer & Real-Time Error Boundary Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-main: #0f172a;
      --bg-card: #1e293b;
      --bg-card-hover: #334155;
      --border-color: #334155;
      --accent-purple: #818cf8;
      --accent-pink: #ec4899;
      --accent-cyan: #06b6d4;
      --accent-red: #ef4444;
      --accent-green: #10b981;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', sans-serif;
    }

    body {
      background-color: var(--bg-main);
      color: var(--text-main);
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    /* Sidebar */
    .sidebar {
      width: 320px;
      background: var(--bg-card);
      border-right: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
    }

    .sidebar-header {
      padding: 20px;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .sidebar-header h1 {
      font-size: 16px;
      font-weight: 700;
      background: linear-gradient(135deg, var(--accent-purple), var(--accent-pink));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .session-list {
      flex: 1;
      overflow-y: auto;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .session-card {
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 14px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .session-card:hover, .session-card.active {
      border-color: var(--accent-purple);
      background: var(--bg-card-hover);
    }

    .session-badge {
      display: inline-block;
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      padding: 2px 8px;
      border-radius: 12px;
      margin-bottom: 6px;
    }

    .badge-error { background: rgba(239, 68, 68, 0.2); color: var(--accent-red); border: 1px solid var(--accent-red); }
    .badge-rejection { background: rgba(236, 72, 153, 0.2); color: var(--accent-pink); border: 1px solid var(--accent-pink); }

    .session-title {
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 4px;
      word-break: break-word;
    }

    .session-meta {
      font-size: 11px;
      color: var(--text-muted);
      display: flex;
      justify-content: space-between;
    }

    /* Main Replayer Workspace */
    .workspace {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: #090d16;
    }

    .player-header {
      padding: 16px 24px;
      background: var(--bg-card);
      border-bottom: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .error-info-box h2 {
      font-size: 15px;
      color: var(--accent-red);
      font-family: 'Fira Code', monospace;
    }

    .error-info-box p {
      font-size: 12px;
      color: var(--text-muted);
    }

    .player-viewport-container {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      background: #020617;
      overflow: hidden;
      padding: 20px;
    }

    .iframe-wrapper {
      position: relative;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
      border-radius: 8px;
      overflow: hidden;
      background: #fff;
      max-width: 100%;
      max-height: 100%;
    }

    iframe {
      border: none;
      width: 1000px;
      height: 600px;
      transform-origin: 0 0;
      pointer-events: none;
    }

    /* Simulated Mouse Cursor & Click Ripple */
    .replayer-cursor {
      position: absolute;
      width: 16px;
      height: 16px;
      background: var(--accent-pink);
      border: 2px solid #fff;
      border-radius: 50%;
      pointer-events: none;
      z-index: 999;
      transform: translate(-50%, -50%);
      display: none;
      box-shadow: 0 0 12px var(--accent-pink);
      transition: left 0.1s linear, top 0.1s linear;
    }

    .click-ripple {
      position: absolute;
      width: 30px;
      height: 30px;
      border: 2px solid var(--accent-cyan);
      border-radius: 50%;
      pointer-events: none;
      z-index: 998;
      animation: ripple 0.6s ease-out forwards;
    }

    @keyframes ripple {
      0% { transform: scale(0.2); opacity: 1; }
      100% { transform: scale(2); opacity: 0; }
    }

    /* Controls Bar */
    .controls-bar {
      background: var(--bg-card);
      border-top: 1px solid var(--border-color);
      padding: 12px 24px;
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .btn-play {
      background: linear-gradient(135deg, var(--accent-purple), var(--accent-pink));
      border: none;
      color: #fff;
      padding: 8px 16px;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    .btn-play:hover { opacity: 0.9; }

    .slider-container {
      flex: 1;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    input[type="range"] {
      flex: 1;
      height: 6px;
      border-radius: 3px;
      background: var(--border-color);
      outline: none;
      accent-color: var(--accent-purple);
      cursor: pointer;
    }

    .time-badge {
      font-family: 'Fira Code', monospace;
      font-size: 12px;
      color: var(--text-muted);
      min-width: 100px;
    }

    .speed-selector {
      background: var(--bg-main);
      color: var(--text-main);
      border: 1px solid var(--border-color);
      border-radius: 4px;
      padding: 4px 8px;
      font-size: 12px;
      cursor: pointer;
    }

    /* Bottom Inspector Tabs */
    .inspector-panel {
      height: 220px;
      background: var(--bg-card);
      border-top: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
    }

    .tab-header {
      display: flex;
      background: rgba(15, 23, 42, 0.4);
      border-bottom: 1px solid var(--border-color);
    }

    .tab-btn {
      padding: 10px 20px;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
      background: none;
      border: none;
      border-bottom: 2px solid transparent;
      cursor: pointer;
    }

    .tab-btn.active {
      color: var(--accent-purple);
      border-bottom-color: var(--accent-purple);
      background: rgba(129, 140, 248, 0.05);
    }

    .tab-content {
      flex: 1;
      overflow-y: auto;
      padding: 14px;
      font-family: 'Fira Code', monospace;
      font-size: 12px;
      display: none;
    }

    .tab-content.active { display: block; }

    .stacktrace-box {
      color: #f87171;
      white-space: pre-wrap;
      line-height: 1.5;
    }

    .network-table {
      width: 100%;
      border-collapse: collapse;
    }

    .network-table th, .network-table td {
      padding: 6px 12px;
      text-align: left;
      border-bottom: 1px solid var(--border-color);
    }

    .network-table th { color: var(--text-muted); font-size: 11px; }

    .method-badge {
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 10px;
    }

    .method-GET { background: rgba(16, 185, 129, 0.2); color: var(--accent-green); }
    .method-POST { background: rgba(6, 182, 212, 0.2); color: var(--accent-cyan); }

    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: var(--text-muted);
      gap: 12px;
    }
  </style>
</head>
<body>

  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="sidebar-header">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <polygon points="5 3 19 12 5 21 5 3" fill="url(#grad1)"/>
        <defs>
          <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#818cf8;" />
            <stop offset="100%" style="stop-color:#ec4899;" />
          </linearGradient>
        </defs>
      </svg>
      <h1>Error Replayer</h1>
    </div>
    <div class="session-list" id="sessionList">
      <div class="empty-state">
        <p>Fetching error reports...</p>
      </div>
    </div>
  </aside>

  <!-- Workspace -->
  <main class="workspace">
    <header class="player-header">
      <div class="error-info-box">
        <h2 id="errorTitle">Select a Session Report</h2>
        <p id="errorSubtitle">Replays exact DOM changes, user events, and network requests leading to the error.</p>
      </div>
      <div id="sessionMetaBadge" class="time-badge">--</div>
    </header>

    <!-- Viewport Container -->
    <div class="player-viewport-container">
      <div class="iframe-wrapper">
        <iframe id="replayIframe" title="Session Replay Viewport"></iframe>
        <div id="replayerCursor" class="replayer-cursor"></div>
      </div>
    </div>

    <!-- Controls -->
    <footer class="controls-bar">
      <button class="btn-play" id="btnPlayPause">▶ Play</button>
      <div class="slider-container">
        <input type="range" id="timelineSlider" min="0" max="1000" value="0">
        <span class="time-badge" id="timeDisplay">0.0s / 0.0s</span>
      </div>
      <select class="speed-selector" id="speedSelect">
        <option value="0.5">0.5x</option>
        <option value="1" selected>1.0x</option>
        <option value="2">2.0x</option>
        <option value="4">4.0x</option>
      </select>
    </footer>

    <!-- Inspector Tabs -->
    <section class="inspector-panel">
      <nav class="tab-header">
        <button class="tab-btn active" onclick="switchTab('tabError')">Stack Trace</button>
        <button class="tab-btn" onclick="switchTab('tabNetwork')">Network Waterfall</button>
        <button class="tab-btn" onclick="switchTab('tabEvents')">Event Feed</button>
      </nav>

      <div id="tabError" class="tab-content active">
        <div class="stacktrace-box" id="stackTraceBox">No session selected.</div>
      </div>

      <div id="tabNetwork" class="tab-content">
        <table class="network-table">
          <thead>
            <tr>
              <th>Method</th>
              <th>URL</th>
              <th>Status</th>
              <th>Duration</th>
            </tr>
          </thead>
          <tbody id="networkTableBody">
            <tr><td colspan="4" style="text-align: center; color: var(--text-muted);">No network requests captured</td></tr>
          </tbody>
        </table>
      </div>

      <div id="tabEvents" class="tab-content">
        <div id="eventFeedBox">No events recorded.</div>
      </div>
    </section>
  </main>

  <script src="/dashboard/replay-engine.js"></script>
  <script>
    let replayer = null;
    let currentReport = null;

    document.addEventListener('DOMContentLoaded', () => {
      const iframe = document.getElementById('replayIframe');
      const cursor = document.getElementById('replayerCursor');
      const slider = document.getElementById('timelineSlider');
      const timeDisplay = document.getElementById('timeDisplay');

      replayer = new SessionReplayer(iframe, cursor, slider, timeDisplay);

      document.getElementById('btnPlayPause').addEventListener('click', () => {
        if (replayer.isPlaying) {
          replayer.pause();
          document.getElementById('btnPlayPause').textContent = '▶ Play';
        } else {
          replayer.play();
          document.getElementById('btnPlayPause').textContent = '⏸ Pause';
        }
      });

      slider.addEventListener('input', (e) => {
        replayer.seek(Number(e.target.value));
      });

      document.getElementById('speedSelect').addEventListener('change', (e) => {
        replayer.setSpeed(Number(e.target.value));
      });

      fetchReportsList();
      setInterval(fetchReportsList, 5000); // Auto-refresh reports every 5s
    });

    async function fetchReportsList() {
      try {
        const res = await fetch('/api/reports');
        const reports = await res.json();

        const listEl = document.getElementById('sessionList');
        if (reports.length === 0) {
          listEl.innerHTML = `
            <div class="empty-state">
              <p>No error reports yet.</p>
              <small>Open <a href="/demo" target="_blank" style="color: var(--accent-purple);">/demo</a> to trigger errors!</small>
            </div>`;
          return;
        }

        listEl.innerHTML = reports.map(r => `
          <div class="session-card ${currentReport?.id === r.id ? 'active' : ''}" onclick="loadReport('${r.id}')">
            <span class="session-badge badge-error">${r.error?.type || 'ERROR'}</span>
            <div class="session-title">${escapeHTML(r.error?.message || 'Uncaught Error')}</div>
            <div class="session-meta">
              <span>${new Date(r.timestamp).toLocaleTimeString()}</span>
              <span>${r.eventCount} events</span>
            </div>
          </div>
        `).join('');
      } catch (err) {
        console.error('Failed to fetch reports:', err);
      }
    }

    async function loadReport(id) {
      try {
        const res = await fetch(`/api/reports/${id}`);
        currentReport = await res.json();

        document.getElementById('errorTitle').textContent = currentReport.error?.message || 'Error Captured';
        document.getElementById('errorSubtitle').textContent = `URL: ${currentReport.url} | Viewport: ${currentReport.viewport?.width}x${currentReport.viewport?.height}`;
        document.getElementById('sessionMetaBadge').textContent = `ID: ${currentReport.id}`;

        // Render Stack Trace
        document.getElementById('stackTraceBox').textContent = currentReport.error?.stack || currentReport.error?.message || 'No stack trace available';

        // Render Network Waterfall
        const netEvents = (currentReport.events || []).filter(e => e.type === 'NETWORK');
        const netBody = document.getElementById('networkTableBody');
        if (netEvents.length > 0) {
          netBody.innerHTML = netEvents.map(e => `
            <tr>
              <td><span class="method-badge method-${e.data.method}">${e.data.method}</span></td>
              <td style="word-break: break-all;">${escapeHTML(e.data.url)}</td>
              <td style="color: ${e.data.status >= 400 ? 'var(--accent-red)' : 'var(--accent-green)'}">${e.data.status}</td>
              <td>${e.data.duration}ms</td>
            </tr>
          `).join('');
        } else {
          netBody.innerHTML = `<tr><td colspan="4" style="text-align: center; color: var(--text-muted);">No network requests captured</td></tr>`;
        }

        // Render Events Feed
        const eventFeedBox = document.getElementById('eventFeedBox');
        eventFeedBox.innerHTML = (currentReport.events || []).map(e => `
          <div style="padding: 4px 0; border-bottom: 1px solid rgba(255,255,255,0.05);">
            <strong style="color: var(--accent-purple)">[${e.type}]</strong> ${JSON.stringify(e.data)}
          </div>
        `).join('');

        // Load into replayer
        replayer.loadPayload(currentReport);
        document.getElementById('btnPlayPause').textContent = '▶ Play';

        fetchReportsList();
      } catch (err) {
        console.error('Failed to load report payload:', err);
      }
    }

    function switchTab(tabId) {
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
      
      event.currentTarget.classList.add('active');
      document.getElementById(tabId).classList.add('active');
    }

    function escapeHTML(str) {
      return (str || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;');
    }
  </script>
</body>
</html>
