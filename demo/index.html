<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TraceBuffer ⚡ — Interactive Demo Sandbox</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #030712;
      --card: #111827;
      --border: rgba(255, 255, 255, 0.08);
      --primary: #6366f1;
      --pink: #ec4899;
      --danger: #f43f5e;
      --warning: #fbbf24;
      --success: #10b981;
      --text: #f9fafb;
      --muted: #9ca3af;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Outfit', sans-serif; }

    body {
      background-color: var(--bg);
      background-image: 
        radial-gradient(at 0% 0%, rgba(99, 102, 241, 0.15) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(236, 72, 153, 0.12) 0px, transparent 50%);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 620px;
      background: rgba(17, 24, 39, 0.8);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 36px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), 0 0 30px rgba(99, 102, 241, 0.15);
      position: relative;
    }

    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo {
      width: 38px;
      height: 38px;
      background: linear-gradient(135deg, var(--primary), var(--pink));
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      box-shadow: 0 0 20px rgba(99, 102, 241, 0.5);
    }

    h1 {
      font-size: 22px;
      font-weight: 800;
      background: linear-gradient(135deg, #ffffff, #818cf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .status-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      font-weight: 700;
      color: var(--success);
      background: rgba(16, 185, 129, 0.12);
      border: 1px solid rgba(16, 185, 129, 0.3);
      padding: 4px 10px;
      border-radius: 20px;
      text-transform: uppercase;
    }

    .dot-live {
      width: 6px;
      height: 6px;
      background: var(--success);
      border-radius: 50%;
      box-shadow: 0 0 8px var(--success);
    }

    p.subtitle {
      color: var(--muted);
      font-size: 14px;
      margin-bottom: 28px;
      line-height: 1.5;
    }

    .form-group {
      margin-bottom: 18px;
    }

    label {
      display: block;
      font-size: 11px;
      font-weight: 700;
      color: var(--muted);
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    input {
      width: 100%;
      padding: 12px 16px;
      background: #030712;
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 15px rgba(99, 102, 241, 0.25);
    }

    .btn-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 28px;
    }

    button {
      padding: 14px 18px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 13px;
      border: none;
      cursor: pointer;
      transition: transform 0.1s, opacity 0.2s, box-shadow 0.2s;
    }

    button:active { transform: scale(0.98); }

    .btn-danger {
      background: linear-gradient(135deg, #f43f5e, #e11d48);
      color: #fff;
      box-shadow: 0 4px 14px rgba(244, 63, 94, 0.35);
    }

    .btn-warning {
      background: linear-gradient(135deg, #f59e0b, #d97706);
      color: #fff;
      box-shadow: 0 4px 14px rgba(245, 158, 11, 0.35);
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--primary), var(--pink));
      color: #fff;
      box-shadow: 0 4px 14px rgba(99, 102, 241, 0.35);
    }

    .btn-secondary {
      background: #1f2937;
      color: #fff;
      border: 1px solid var(--border);
    }

    .cart-box {
      margin-top: 28px;
      background: #030712;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 18px;
    }

    .cart-box h3 {
      font-size: 13px;
      margin-bottom: 12px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .cart-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .cart-item {
      background: #111827;
      border: 1px solid var(--border);
      padding: 10px 14px;
      border-radius: 6px;
      font-size: 13px;
      display: flex;
      justify-content: space-between;
      animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header-bar">
      <div class="brand">
        <div class="logo">⚡</div>
        <h1>TraceBuffer</h1>
      </div>
      <div class="status-badge">
        <div class="dot-live"></div> 5KB Tracker Active
      </div>
    </div>

    <p class="subtitle">Type into inputs, add cart items, and trigger deliberate errors. TraceBuffer captures the last 10 seconds of DOM mutations and replays them in the dashboard.</p>

    <div class="form-group">
      <label>Full Name (Recorded Live)</label>
      <input type="text" id="inputName" placeholder="Beycan Yildiz">
    </div>

    <div class="form-group">
      <label>Password (Auto-Masked PII 🔒)</label>
      <input type="password" id="inputPassword" placeholder="••••••••">
    </div>

    <div class="form-group">
      <label>Credit Card (Data-Masked PII 🔒)</label>
      <input type="text" data-mask="true" id="inputCard" placeholder="4532 •••• •••• 8912">
    </div>

    <div class="cart-box">
      <h3>Dynamic Cart Items (DOM Mutations)</h3>
      <ul class="cart-list" id="cartList">
        <li class="cart-item"><span>🚀 Premium Mechanical Keyboard</span> <strong>$149</strong></li>
      </ul>
    </div>

    <div class="btn-grid">
      <button class="btn-secondary" onclick="addCartItem()">+ Add Cart Item</button>
      <button class="btn-primary" onclick="triggerFetchError()">🌐 Network 500 Test</button>
      <button class="btn-danger" onclick="triggerNullError()">💥 Uncaught Null Exception</button>
      <button class="btn-warning" onclick="triggerRejectionError()">⚠️ Promise Rejection</button>
    </div>
  </div>

  <!-- Inline SDK Bundle for zero-config demonstration -->
  <script>
    (function() {
      class CircularBuffer {
        constructor(maxCapacity = 1000, maxAgeMs = 10000) {
          this.buffer = [];
          this.maxCapacity = maxCapacity;
          this.maxAgeMs = maxAgeMs;
        }
        push(event) {
          this.buffer.push(event);
          this.prune();
        }
        getEvents() {
          this.prune();
          return [...this.buffer];
        }
        prune() {
          const now = Date.now();
          const cutoff = now - this.maxAgeMs;
          while (this.buffer.length > 0 && this.buffer[0].timestamp < cutoff) {
            this.buffer.shift();
          }
          while (this.buffer.length > this.maxCapacity) {
            this.buffer.shift();
          }
        }
      }

      let nodeIdCounter = 1;
      const nodeMap = new WeakMap();
      function getOrCreateNodeId(node) {
        if (!node) return null;
        if (nodeMap.has(node)) return nodeMap.get(node);
        const id = nodeIdCounter++;
        nodeMap.set(node, id);
        if (node instanceof HTMLElement) node.setAttribute('data-sr-id', String(id));
        return id;
      }

      function serializeDOM(node = document.documentElement) {
        if (!node) return '';
        const id = getOrCreateNodeId(node);
        if (node.nodeType === Node.TEXT_NODE) {
          const parent = node.parentElement;
          if (parent && isMasked(parent)) return '***';
          return node.textContent || '';
        }
        if (node.nodeType !== Node.ELEMENT_NODE) return '';
        const el = node;
        const tagName = el.tagName.toLowerCase();
        if (tagName === 'script') return { id, tagName: 'script', attributes: {}, children: [] };
        
        const attributes = {};
        for (let i = 0; i < el.attributes.length; i++) {
          const attr = el.attributes[i];
          if (attr.name === 'value' && isMasked(el)) {
            attributes[attr.name] = '***';
          } else {
            attributes[attr.name] = attr.value;
          }
        }

        if (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA' || el.tagName === 'SELECT') {
          attributes['value'] = isMasked(el) ? '***' : el.value;
        }

        const children = [];
        el.childNodes.forEach(child => {
          const s = serializeDOM(child);
          if (s !== '') children.push(s);
        });

        return { id, tagName, attributes, children };
      }

      function isMasked(el) {
        if (!el || !(el instanceof HTMLElement)) return false;
        if (el.hasAttribute('data-mask')) return true;
        if (el.tagName === 'INPUT' && el.type.toLowerCase() === 'password') return true;
        return false;
      }

      function getElementSelector(el) {
        if (!el) return '';
        if (el.id) return `#${el.id}`;
        if (el.className && typeof el.className === 'string') {
          return `${el.tagName.toLowerCase()}.${el.className.split(' ').join('.')}`;
        }
        return el.tagName.toLowerCase();
      }

      class SDK {
        constructor(endpoint) {
          this.endpoint = endpoint;
          this.buffer = new CircularBuffer(1000, 10000);
          this.init();
        }
        init() {
          serializeDOM(document.documentElement);

          const emit = (type, data) => {
            this.buffer.push({
              id: Math.random().toString(36).substr(2, 9),
              type,
              timestamp: Date.now(),
              data
            });
          };

          // DOM Mutation Observer
          const observer = new MutationObserver(mutations => {
            mutations.forEach(m => {
              const targetId = getOrCreateNodeId(m.target);
              if (m.type === 'childList') {
                const addedNodes = [];
                m.addedNodes.forEach(node => {
                  if (node instanceof HTMLElement) {
                    addedNodes.push({ id: getOrCreateNodeId(node), html: node.outerHTML });
                  }
                });
                const removedNodes = [];
                m.removedNodes.forEach(node => {
                  if (node instanceof HTMLElement) {
                    removedNodes.push({ id: getOrCreateNodeId(node), tagName: node.tagName });
                  }
                });
                if (addedNodes.length > 0 || removedNodes.length > 0) {
                  emit('DOM_MUTATION', { mutationType: 'childList', targetId, addedNodes, removedNodes });
                }
              } else if (m.type === 'attributes') {
                emit('DOM_MUTATION', {
                  mutationType: 'attributes',
                  targetId,
                  attributeName: m.attributeName,
                  newValue: m.target.getAttribute(m.attributeName)
                });
              } else if (m.type === 'characterData') {
                emit('DOM_MUTATION', { mutationType: 'characterData', targetId, newValue: m.target.textContent });
              }
            });
          });
          observer.observe(document.documentElement, { childList: true, attributes: true, characterData: true, subtree: true });

          // Event Listeners
          window.addEventListener('click', e => {
            if (!e.target) return;
            const targetId = getOrCreateNodeId(e.target);
            emit('CLICK', {
              x: e.clientX,
              y: e.clientY,
              tagName: e.target.tagName,
              targetId,
              selector: getElementSelector(e.target)
            });
          }, true);

          let lastMove = 0;
          window.addEventListener('mousemove', e => {
            const now = Date.now();
            if (now - lastMove < 100) return;
            lastMove = now;
            emit('MOUSE_MOVE', { x: e.clientX, y: e.clientY });
          });

          window.addEventListener('input', e => {
            if (!e.target) return;
            const targetId = getOrCreateNodeId(e.target);
            const val = isMasked(e.target) ? '***' : e.target.value;
            emit('INPUT', {
              targetId,
              selector: getElementSelector(e.target),
              value: val
            });
          }, true);

          // Network Fetch Interceptor
          const origFetch = window.fetch;
          const self = this;
          window.fetch = async function(...args) {
            const url = typeof args[0] === 'string' ? args[0] : args[0]?.url || '';
            if (url.includes('/api/reports')) return origFetch.apply(this, args);
            const start = Date.now();
            try {
              const res = await origFetch.apply(this, args);
              emit('NETWORK', { url, method: args[1]?.method || 'GET', status: res.status, duration: Date.now() - start });
              return res;
            } catch (err) {
              emit('NETWORK', { url, method: args[1]?.method || 'GET', status: 500, duration: Date.now() - start });
              throw err;
            }
          };

          // Error Handlers
          window.addEventListener('error', e => this.sendError(e.message, e.error?.stack, 'uncaught_exception'));
          window.addEventListener('unhandledrejection', e => this.sendError(e.reason?.message || String(e.reason), e.reason?.stack, 'unhandled_rejection'));

          console.log('[TraceBuffer SDK] Initialized & listening');
        }

        async sendError(message, stack, type) {
          const snapshot = serializeDOM(document.documentElement);
          const payload = {
            id: 'err_' + Math.random().toString(36).substr(2, 9),
            timestamp: Date.now(),
            url: window.location.href,
            userAgent: navigator.userAgent,
            viewport: { width: window.innerWidth, height: window.innerHeight },
            error: { message, stack, type },
            initialSnapshot: snapshot,
            events: this.buffer.getEvents()
          };

          console.warn('[TraceBuffer SDK] Transmitting payload:', payload);
          await fetch(this.endpoint, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });
        }
      }

      window.SessionTracker = new SDK('/api/reports');
    })();

    // Demo App Functions
    let cartCounter = 1;
    function addCartItem() {
      cartCounter++;
      const list = document.getElementById('cartList');
      const li = document.createElement('li');
      li.className = 'cart-item';
      li.innerHTML = `<span>🎧 Wireless Headphones Gen ${cartCounter}</span> <strong>$${99 + cartCounter * 10}</strong>`;
      list.appendChild(li);
    }

    async function triggerFetchError() {
      try {
        await fetch('/api/fake-failing-endpoint-500', { method: 'POST' });
      } catch(e) {
        console.log('Fetch error captured');
      }
    }

    function triggerNullError() {
      const obj = null;
      obj.nonExistentMethod();
    }

    function triggerRejectionError() {
      new Promise((_, reject) => {
        reject(new Error('Database Connection Timeout Rejection'));
      });
    }
  </script>
</body>
</html>
