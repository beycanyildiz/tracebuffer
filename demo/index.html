<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Session Tracker Demo Application</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0b0f19;
      --card: #111827;
      --border: #1f2937;
      --primary: #6366f1;
      --danger: #ef4444;
      --warning: #f59e0b;
      --text: #f9fafb;
      --muted: #9ca3af;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }

    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 600px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 32px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    h1 {
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 8px;
      background: linear-gradient(135deg, #a5b4fc, #f472b6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    p.subtitle {
      color: var(--muted);
      font-size: 14px;
      margin-bottom: 24px;
    }

    .form-group {
      margin-bottom: 16px;
    }

    label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: var(--muted);
      margin-bottom: 6px;
      text-transform: uppercase;
    }

    input {
      width: 100%;
      padding: 10px 14px;
      background: #030712;
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      font-size: 14px;
      outline: none;
    }

    input:focus {
      border-color: var(--primary);
    }

    .btn-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 24px;
    }

    button {
      padding: 12px 16px;
      border-radius: 6px;
      font-weight: 600;
      font-size: 13px;
      border: none;
      cursor: pointer;
      transition: transform 0.1s, opacity 0.2s;
    }

    button:active { transform: scale(0.98); }

    .btn-danger { background: var(--danger); color: #fff; }
    .btn-warning { background: var(--warning); color: #fff; }
    .btn-primary { background: var(--primary); color: #fff; }
    .btn-secondary { background: #374151; color: #fff; }

    .cart-box {
      margin-top: 24px;
      background: #030712;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px;
    }

    .cart-box h3 {
      font-size: 14px;
      margin-bottom: 12px;
      color: var(--muted);
    }

    .cart-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .cart-item {
      background: #111827;
      padding: 8px 12px;
      border-radius: 4px;
      font-size: 13px;
      display: flex;
      justify-content: space-between;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>E-Commerce Test Demo App</h1>
    <p class="subtitle">Interact with this page, type in inputs, and trigger test errors to record session replays in real-time.</p>

    <div class="form-group">
      <label>Full Name (Recorded)</label>
      <input type="text" id="inputName" placeholder="John Doe">
    </div>

    <div class="form-group">
      <label>Password (Auto-Masked PII)</label>
      <input type="password" id="inputPassword" placeholder="••••••••">
    </div>

    <div class="form-group">
      <label>Credit Card (Data-Masked PII)</label>
      <input type="text" data-mask="true" id="inputCard" placeholder="4532 •••• •••• 8912">
    </div>

    <div class="cart-box">
      <h3>Dynamic Cart Items (DOM Mutations)</h3>
      <ul class="cart-list" id="cartList">
        <li class="cart-item"><span>🚀 Premium Mechanical Keyboard</span> <strong>$149</strong></li>
      </ul>
    </div>

    <div class="btn-grid">
      <button class="btn-secondary" onclick="addCartItem()">+ Add Cart Item</button>
      <button class="btn-primary" onclick="triggerFetchError()">🌐 Network 500 Test</button>
      <button class="btn-danger" onclick="triggerNullError()">💥 Uncaught Null Exception</button>
      <button class="btn-warning" onclick="triggerRejectionError()">⚠️ Promise Rejection</button>
    </div>
  </div>

  <!-- Inline SDK Bundle for zero-config demonstration -->
  <script>
    (function() {
      class CircularBuffer {
        constructor(maxCapacity = 1000, maxAgeMs = 10000) {
          this.buffer = [];
          this.maxCapacity = maxCapacity;
          this.maxAgeMs = maxAgeMs;
        }
        push(event) {
          this.buffer.push(event);
          this.prune();
        }
        getEvents() {
          this.prune();
          return [...this.buffer];
        }
        prune() {
          const now = Date.now();
          const cutoff = now - this.maxAgeMs;
          while (this.buffer.length > 0 && this.buffer[0].timestamp < cutoff) {
            this.buffer.shift();
          }
          while (this.buffer.length > this.maxCapacity) {
            this.buffer.shift();
          }
        }
      }

      let nodeIdCounter = 1;
      const nodeMap = new WeakMap();
      function getOrCreateNodeId(node) {
        if (!node) return null;
        if (nodeMap.has(node)) return nodeMap.get(node);
        const id = nodeIdCounter++;
        nodeMap.set(node, id);
        if (node instanceof HTMLElement) node.setAttribute('data-sr-id', String(id));
        return id;
      }

      function serializeDOM(node = document.documentElement) {
        if (!node) return '';
        const id = getOrCreateNodeId(node);
        if (node.nodeType === Node.TEXT_NODE) {
          const parent = node.parentElement;
          if (parent && isMasked(parent)) return '***';
          return node.textContent || '';
        }
        if (node.nodeType !== Node.ELEMENT_NODE) return '';
        const el = node;
        const tagName = el.tagName.toLowerCase();
        if (tagName === 'script') return { id, tagName: 'script', attributes: {}, children: [] };
        
        const attributes = {};
        for (let i = 0; i < el.attributes.length; i++) {
          const attr = el.attributes[i];
          if (attr.name === 'value' && isMasked(el)) {
            attributes[attr.name] = '***';
          } else {
            attributes[attr.name] = attr.value;
          }
        }

        const children = [];
        el.childNodes.forEach(child => {
          const s = serializeDOM(child);
          if (s !== '') children.push(s);
        });

        return { id, tagName, attributes, children };
      }

      function isMasked(el) {
        if (!el || !(el instanceof HTMLElement)) return false;
        if (el.hasAttribute('data-mask')) return true;
        if (el.tagName === 'INPUT' && el.type.toLowerCase() === 'password') return true;
        return false;
      }

      function getElementSelector(el) {
        if (!el) return '';
        if (el.id) return `#${el.id}`;
        if (el.className && typeof el.className === 'string') {
          return `${el.tagName.toLowerCase()}.${el.className.split(' ').join('.')}`;
        }
        return el.tagName.toLowerCase();
      }

      class SDK {
        constructor(endpoint) {
          this.endpoint = endpoint;
          this.buffer = new CircularBuffer(1000, 10000);
          this.init();
        }
        init() {
          // Pre-tag all existing DOM elements with data-sr-id
          serializeDOM(document.documentElement);

          const emit = (type, data) => {
            this.buffer.push({
              id: Math.random().toString(36).substr(2, 9),
              type,
              timestamp: Date.now(),
              data
            });
          };

          // DOM Mutation Observer
          const observer = new MutationObserver(mutations => {
            mutations.forEach(m => {
              const targetId = getOrCreateNodeId(m.target);
              if (m.type === 'childList') {
                const addedNodes = [];
                m.addedNodes.forEach(node => {
                  if (node instanceof HTMLElement) {
                    addedNodes.push({ id: getOrCreateNodeId(node), html: node.outerHTML });
                  }
                });
                const removedNodes = [];
                m.removedNodes.forEach(node => {
                  if (node instanceof HTMLElement) {
                    removedNodes.push({ id: getOrCreateNodeId(node), tagName: node.tagName });
                  }
                });
                if (addedNodes.length > 0 || removedNodes.length > 0) {
                  emit('DOM_MUTATION', { mutationType: 'childList', targetId, addedNodes, removedNodes });
                }
              } else if (m.type === 'attributes') {
                emit('DOM_MUTATION', {
                  mutationType: 'attributes',
                  targetId,
                  attributeName: m.attributeName,
                  newValue: m.target.getAttribute(m.attributeName)
                });
              } else if (m.type === 'characterData') {
                emit('DOM_MUTATION', { mutationType: 'characterData', targetId, newValue: m.target.textContent });
              }
            });
          });
          observer.observe(document.documentElement, { childList: true, attributes: true, characterData: true, subtree: true });

          // Event Listeners
          window.addEventListener('click', e => {
            if (!e.target) return;
            const targetId = getOrCreateNodeId(e.target);
            emit('CLICK', {
              x: e.clientX,
              y: e.clientY,
              tagName: e.target.tagName,
              targetId,
              selector: getElementSelector(e.target)
            });
          }, true);

          let lastMove = 0;
          window.addEventListener('mousemove', e => {
            const now = Date.now();
            if (now - lastMove < 100) return;
            lastMove = now;
            emit('MOUSE_MOVE', { x: e.clientX, y: e.clientY });
          });

          window.addEventListener('input', e => {
            if (!e.target) return;
            const targetId = getOrCreateNodeId(e.target);
            const val = isMasked(e.target) ? '***' : e.target.value;
            emit('INPUT', {
              targetId,
              selector: getElementSelector(e.target),
              value: val
            });
          }, true);

          // Network Fetch Interceptor
          const origFetch = window.fetch;
          const self = this;
          window.fetch = async function(...args) {
            const url = typeof args[0] === 'string' ? args[0] : args[0]?.url || '';
            if (url.includes('/api/reports')) return origFetch.apply(this, args);
            const start = Date.now();
            try {
              const res = await origFetch.apply(this, args);
              emit('NETWORK', { url, method: args[1]?.method || 'GET', status: res.status, duration: Date.now() - start });
              return res;
            } catch (err) {
              emit('NETWORK', { url, method: args[1]?.method || 'GET', status: 500, duration: Date.now() - start });
              throw err;
            }
          };

          // Error Handlers
          window.addEventListener('error', e => this.sendError(e.message, e.error?.stack, 'uncaught_exception'));
          window.addEventListener('unhandledrejection', e => this.sendError(e.reason?.message || String(e.reason), e.reason?.stack, 'unhandled_rejection'));

          console.log('[SessionTracker SDK] Initialized & listening');
        }

        async sendError(message, stack, type) {
          const snapshot = serializeDOM(document.documentElement);
          const payload = {
            id: 'err_' + Math.random().toString(36).substr(2, 9),
            timestamp: Date.now(),
            url: window.location.href,
            userAgent: navigator.userAgent,
            viewport: { width: window.innerWidth, height: window.innerHeight },
            error: { message, stack, type },
            initialSnapshot: snapshot,
            events: this.buffer.getEvents()
          };

          console.warn('[SDK] Transmitting payload:', payload);
          await fetch(this.endpoint, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });
        }
      }

      window.SessionTracker = new SDK('/api/reports');
    })();

    // Demo App Functions
    let cartCounter = 1;
    function addCartItem() {
      cartCounter++;
      const list = document.getElementById('cartList');
      const li = document.createElement('li');
      li.className = 'cart-item';
      li.innerHTML = `<span>🎧 Wireless Headphones Gen ${cartCounter}</span> <strong>$${99 + cartCounter * 10}</strong>`;
      list.appendChild(li);
    }

    async function triggerFetchError() {
      try {
        await fetch('/api/fake-failing-endpoint-500', { method: 'POST' });
      } catch(e) {
        console.log('Fetch error captured');
      }
    }

    function triggerNullError() {
      const obj = null;
      obj.nonExistentMethod();
    }

    function triggerRejectionError() {
      new Promise((_, reject) => {
        reject(new Error('Database Connection Timeout Rejection'));
      });
    }
  </script>
</body>
</html>
